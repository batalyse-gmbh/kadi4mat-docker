# Optional override: attach kadi, celery and celerybeat to an existing Docker network, e.g.
# the one shared by your reverse proxy container and/or your PostgreSQL container. Enable it
# in .env with
#   COMPOSE_FILE=docker-compose.yml:compose.external-network.yml
#   EXTERNAL_NETWORK=<network name>
#
# On that network, kadi is reachable as "kadi4mat-kadi:8000" (proxy_pass/reverse_proxy
# target). celery and celerybeat join too, because they talk to the database as well.
#
# If the database is on a different network than the proxy, also add
# compose.db-network.yml. Never point both overrides (or the x-kadi anchor in
# docker-compose.yml) at the same network. The network would be declared twice per
# container, which Compose silently collapses (possibly dropping the alias) or fails on when
# recreating containers, depending on the version. scripts/check-compose.sh detects this.
services:
  kadi:
    networks:
      external:
        aliases: [kadi4mat-kadi]
  celery:
    networks:
      external: {}
  celerybeat:
    networks:
      external: {}

networks:
  external:
    name: ${EXTERNAL_NETWORK:?set EXTERNAL_NETWORK in .env}
    external: true
