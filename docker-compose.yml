# Default project name. scripts/instance.sh gives every further instance its own through
# COMPOSE_PROJECT_NAME, which takes precedence over this.
name: kadi4mat

x-kadi: &kadi
  image: kadi4mat:${KADI_VERSION:-1.12.0}
  restart: unless-stopped
  init: true
  # scripts/instance.sh points this at instances/<name>.env.
  env_file: ${KADI_ENV_FILE:-.env}
  extra_hosts:
    # Lets POSTGRES_HOST=host.docker.internal reach a database running on the Docker host.
    - "host.docker.internal:host-gateway"
  volumes:
    - storage:/opt/kadi/storage
    - uploads:/opt/kadi/uploads
  # Only the internal network belongs here. Attach external networks through
  # compose.external-network.yml / compose.db-network.yml instead: listing the same network
  # in this anchor and in an override declares it twice for the same container. Compose 5.5
  # happens to collapse that into one attachment; other versions may not, and which entry's
  # settings (e.g. the kadi4mat-kadi alias) win is not specified.
  networks: [backend]

services:
  # Bundled database, enabled with COMPOSE_PROFILES=postgres. Leave the profile out to use
  # an existing server via POSTGRES_HOST/POSTGRES_PORT instead.
  postgres:
    profiles: [postgres]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kadi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kadi}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      # postgres:18 keeps its data in a versioned subdirectory (18/docker) and refuses to
      # start with a mount at the old path /var/lib/postgresql/data.
      - postgres:/var/lib/postgresql
    networks: [backend]
    # Every probe is a "docker exec", which costs far more than the check itself. So all
    # healthchecks probe every start_interval until the first success (keeping
    # "depends_on: service_healthy" and "up --wait" fast), then only every interval.
    # start_period must cover the slowest start: a service still starting when it ends
    # waits a full interval for the next probe.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 100s
      start_interval: 2s

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 100s
      start_interval: 2s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.19.22}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Keeps the heap out of swap; requires the memlock ulimit below.
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
      start_interval: 5s

  # uWSGI application server. Runs "kadi db init" and "kadi search init" on start.
  kadi:
    <<: *kadi
    build:
      context: .
      args:
        KADI_VERSION: ${KADI_VERSION:-1.12.0}
    command: ["web"]
    # Replaces (does not extend) the anchor's list, so storage and uploads are repeated.
    volumes:
      - storage:/opt/kadi/storage
      - uploads:/opt/kadi/uploads
      # OIDC signing keys. Only the web app signs tokens, so celery does not mount them.
      - oidc:/opt/kadi/oidc
    environment:
      UWSGI_PROCESSES: ${UWSGI_PROCESSES:-4}
      UWSGI_OFFLOAD_THREADS: ${UWSGI_OFFLOAD_THREADS:-2}
    ports:
      # Plain HTTP for a reverse proxy running directly on the host. Never bind this
      # publicly: Kadi trusts X-Forwarded-For, so direct clients could spoof their IP.
      - "${KADI_HTTP_BIND:-127.0.0.1:8000}:8000"
    depends_on:
      postgres: { condition: service_healthy, required: false }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 360s
      start_interval: 5s

  celery:
    <<: *kadi
    command: ["worker"]
    depends_on:
      kadi: { condition: service_healthy }
    healthcheck:
      # Plain celery with only the broker URL answers in about a second; "kadi celery ..."
      # would load the whole Flask app and check the database on every probe.
      test: ["CMD-SHELL", "celery --broker \"$${KADI_REDIS_URL:-redis://redis:6379/0}\" inspect ping --destination \"celery@$${HOSTNAME}\" --timeout 10 >/dev/null"]
      interval: 120s
      timeout: 20s
      retries: 3
      start_period: 60s
      start_interval: 5s

  celerybeat:
    <<: *kadi
    command: ["beat"]
    depends_on:
      kadi: { condition: service_healthy }
    healthcheck:
      # The entrypoint deletes the schedule file on start, so its presence means this run
      # got past app initialization and set up the scheduler. The file's mtime is no
      # liveness signal: Kadi's only periodic task runs hourly. A crashed beat process
      # stops the container, which resets the health status.
      test: ["CMD", "test", "-f", "/tmp/celerybeat-schedule"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

  # Bundled reverse proxy, only for hosts without one: enable with COMPOSE_PROFILES=caddy.
  # Needs ports 80 and 443 and a KADI_SERVER_NAME without a port.
  caddy:
    profiles: [caddy]
    image: caddy:2
    restart: unless-stopped
    environment:
      KADI_SERVER_NAME: ${KADI_SERVER_NAME:?set KADI_SERVER_NAME in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      kadi: { condition: service_healthy }

networks:
  backend:

volumes:
  postgres:
  redis:
  elasticsearch:
  storage:
  uploads:
  oidc:
  caddy_data:
  caddy_config:
