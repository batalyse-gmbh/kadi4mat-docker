# Based on the output of "kadi utils uwsgi" and "kadi utils apache", adapted for containers
# behind an HTTP reverse proxy: plain HTTP socket, logs to stdout, no uid/gid switching
# (the image already runs as "kadi"), static files served by uWSGI instead of Apache.
[uwsgi]
http-socket = 0.0.0.0:8000

master = true
vacuum = true
need-app = true
enable-threads = true
single-interpreter = true
die-on-term = true

processes = $(UWSGI_PROCESSES)
auto-procname = true
procname-prefix-spaced = kadi

disable-logging = true

buffer-size = 32768
post-buffering = 32768
harakiri = 3600
socket-timeout = 600
max-requests = 5000
max-worker-lifetime = 3600
max-worker-lifetime-delta = 5
reload-on-rss = 2048
evil-reload-on-rss = 8192
worker-reload-mercy = 60

umask = 027

module = kadi.wsgi:app

# Kadi streams file downloads itself (USE_X_SENDFILE = False in kadi.py). uWSGI serves
# these wsgi.file_wrapper responses and static files from offload threads, so large
# downloads do not block a worker.
offload-threads = $(UWSGI_OFFLOAD_THREADS)
# Kadi always advertises range support, expecting the web server to implement it, but
# streamed responses are always complete. Drop the header so clients do not try.
pull-header = Accept-Ranges UNUSED_ACCEPT_RANGES

# Static assets and root-level favicons, equivalent to the Alias rules of "kadi utils apache".
static-map = /static=/opt/kadi/static
check-static = /opt/kadi/static/favicons
static-expires-uri = ^/static/ 31536000
